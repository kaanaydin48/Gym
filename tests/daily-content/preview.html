<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../style.css"><title>Senin İçin test görünümü</title><body><main style="max-width:540px;margin:auto;padding:20px"><header><div>Merhaba, sporcu.</div></header><div id="app"><div class="calendar-home"><section class="card month-card"><h2>Kasım 2026</h2><p>Takvim korunur · Test görünümü</p></section></div></div><button id="profile">Profil</button></main><script type="module">
