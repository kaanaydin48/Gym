<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F7F6F2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Gym Tracker</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F7F6F2;color:#28332D}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 calc(90px + env(safe-area-inset-bottom));background:#F7F6F2;min-height:100vh}header{padding:26px 20px 16px;display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;letter-spacing:-.8px;margin:0;font-weight:700}h2{font-size:18px;letter-spacing:-.35px;margin:4px 0 14px}small,.muted{color:#858F87}.wrap{max-width:740px;margin:auto;padding:0 16px}.card{background:#FFFEFC;border:1px solid #E8EBE5;border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 2px 12px rgba(38,56,42,.025)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#F0F2EC;border-radius:15px;padding:14px 6px;text-align:center}.stat strong{display:block;font-size:20px;color:#354B3C}.stat small{font-size:11px}button,select,input{font:inherit}button{border:0;background:#829D88;color:#fff;border-radius:12px;padding:11px 13px;cursor:pointer;font-weight:550}button.secondary{background:#E8EDE6;color:#415A48}button.danger{background:#F4E7E4;color:#A65D55}button:disabled{opacity:.4}input,select{min-width:0;width:100%;background:#FAFAF7;color:#2F3A32;border:1px solid #DDE4DA;border-radius:11px;padding:10px;outline-color:#91AB97}label{font-size:12px;color:#737E75}.row{display:flex;align-items:center;gap:9px;justify-content:space-between}.row>*{min-width:0}.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.day{padding:10px 0;background:#F0F2ED;color:#4D5C50;border-radius:10px;position:relative;font-size:13px}.day.active{background:#829D88;color:white}.day.has:after{content:'•';position:absolute;bottom:0;left:48%;font-size:12px;color:#648D70}.day.active:after{color:white}.empty{visibility:hidden}.exercise{border-top:1px solid #EBEEE8;padding:15px 0}.exercise:first-of-type{border-top:0}.set{display:grid;grid-template-columns:26px 1fr 1fr 1fr 42px;gap:5px;align-items:end;margin:9px 0}.set input{padding:9px 5px;text-align:center}.set input[type=checkbox]{width:22px;height:22px;accent-color:#829D88;margin:auto}.set .idx{text-align:center;color:#89958B;padding-bottom:10px}.hint{font-size:12px;color:#89958B;margin-top:3px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#FFFEFC;border-top:1px solid #E7EAE4;padding:10px 4px calc(10px + env(safe-area-inset-bottom));z-index:10}.tabs button{flex:1;background:transparent;color:#939D94;padding:7px 2px;font-size:12px;font-weight:500}.tabs button.active{color:#5E8267;font-weight:700}.hidden{display:none!important}.bar{height:10px;border-radius:8px;background:#E9EEE7;overflow:hidden}.bar span{display:block;height:100%;background:#8EAA94}.progressline{display:grid;grid-template-columns:70px 1fr 75px;align-items:center;gap:8px;margin:12px 0;font-size:12px}.actionrow{display:flex;gap:8px;flex-wrap:wrap}.actionrow button{flex:1}#timer{font-size:30px;font-variant-numeric:tabular-nums}.notice{font-size:12px;color:#808B82;line-height:1.5}canvas{width:100%;height:220px}#saveStatus{font-size:12px}button:active{transform:scale(.99)}
</style></head><body><header><div><h1>Gym Tracker</h1><small>Kalıcı antrenman günlüğü</small></div><span id="saveStatus" class="muted">Kaydedildi ✓</span></header><main class="wrap"><section id="home"></section><section id="workout" class="hidden"></section><section id="progress" class="hidden"></section><section id="settings" class="hidden"></section></main><nav class="tabs"><button data-tab="home" class="active">▦<br>Takvim</button><button data-tab="workout">▣<br>Antrenman</button><button data-tab="progress">▥<br>İlerleme</button><button data-tab="settings">⚙<br>Yedekleme</button></nav><script src="app.js"></script></body></html>
