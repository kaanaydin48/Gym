<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Gym Tracker</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0b1120;color:#edf2fb}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 calc(90px + env(safe-area-inset-bottom));}header{padding:24px 18px 12px;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0}h2{font-size:18px;margin:4px 0 14px}small,.muted{color:#9baac3}.wrap{max-width:740px;margin:auto;padding:0 15px}.card{background:#172238;border:1px solid #293650;border-radius:16px;padding:15px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#172238;border-radius:13px;padding:12px 6px;text-align:center}.stat strong{display:block;font-size:20px}.stat small{font-size:11px}button,select,input{font:inherit}button{border:0;background:#2b7de9;color:white;border-radius:10px;padding:10px 12px;cursor:pointer}button.secondary{background:#263650}button.danger{background:#713449}button:disabled{opacity:.4}input,select{min-width:0;width:100%;background:#101a2b;color:white;border:1px solid #394962;border-radius:9px;padding:10px}label{font-size:12px;color:#aebbd0}.row{display:flex;align-items:center;gap:9px;justify-content:space-between}.row>*{min-width:0}.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.day{padding:10px 0;background:#223047;border-radius:9px;position:relative;font-size:13px}.day.active{background:#2b7de9}.day.has:after{content:'•';position:absolute;bottom:0;left:48%;font-size:12px;color:#75e0b0}.day.active:after{color:white}.empty{visibility:hidden}.exercise{border-top:1px solid #35445b;padding:13px 0}.exercise:first-of-type{border-top:0}.set{display:grid;grid-template-columns:26px 1fr 1fr 1fr 42px;gap:5px;align-items:end;margin:9px 0}.set input{padding:9px 5px;text-align:center}.set input[type=checkbox]{width:22px;height:22px;accent-color:#42cda0;margin:auto}.set .idx{text-align:center;color:#91a2bd;padding-bottom:10px}.hint{font-size:12px;color:#91a2bd;margin-top:3px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#101827;border-top:1px solid #2c3950;padding:10px 4px calc(10px + env(safe-area-inset-bottom));z-index:10}.tabs button{flex:1;background:transparent;color:#a6b6ce;padding:7px 2px;font-size:12px}.tabs button.active{color:#76adff}.hidden{display:none!important}.bar{height:12px;border-radius:8px;background:#283650;overflow:hidden}.bar span{display:block;height:100%;background:#438feb}.progressline{display:grid;grid-template-columns:70px 1fr 75px;align-items:center;gap:8px;margin:12px 0;font-size:12px}.actionrow{display:flex;gap:8px;flex-wrap:wrap}.actionrow button{flex:1}#timer{font-size:30px;font-variant-numeric:tabular-nums}.notice{font-size:12px;color:#a7b5c9;line-height:1.5}canvas{width:100%;height:220px} </style></head><body><header><div><h1>🏋️ Gym Tracker</h1><small>Kalıcı antrenman günlüğü</small></div><span id="saveStatus" class="muted">Kaydedildi ✓</span></header><main class="wrap"><section id="home"></section><section id="workout" class="hidden"></section><section id="progress" class="hidden"></section><section id="settings" class="hidden"></section></main><nav class="tabs"><button data-tab="home" class="active">▦<br>Takvim</button><button data-tab="workout">▣<br>Antrenman</button><button data-tab="progress">▥<br>İlerleme</button><button data-tab="settings">⚙<br>Yedekleme</button></nav><script src="app.js"></script></body></html>
