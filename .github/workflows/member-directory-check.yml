
name: Member directory checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check membership.js
      - run: node tests/run-unit.cjs
  flow-layout:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/home-flow-layout.cjs
        env:
          FLOW_SCREENSHOT: flow-chromium.png
      - run: node tests/home-flow-layout.cjs
        env:
          FLOW_BROWSER: webkit
          FLOW_SCREENSHOT: flow-webkit.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-layout-screenshots
          path: flow-*.png
